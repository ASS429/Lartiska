<!doctype html>
<html lang="fr" class="dark">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07060A" />

    <!-- SEO de base (chaque page surcharge via react-helmet-async) -->
    <title>Lartiska — Maître Artisan finition luxe au Sénégal · Peinture, fresques, carrelage, epoxy résine</title>
    <meta name="description" content="Lartiska — Maître Artisan finition luxe à Mbour, Sénégal. Peinture artistique, fresques murales, plafonnage décoratif, carrelage zellige, mosaïque, epoxy résine. Tounkara, atelier Mbour. Devis gratuit sous 48h. Intervention Sénégal, Gambie, Mauritanie." />

    <link rel="canonical" href="https://lartiska.sn/" />

    <!-- Géolocalisation Sénégal (signal local SEO) -->
    <meta name="geo.region" content="SN-TH" />
    <meta name="geo.placename" content="Mbour, Sénégal" />
    <meta name="geo.position" content="14.4197;-16.9646" />
    <meta name="ICBM" content="14.4197, -16.9646" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lartiska" />
    <meta property="og:title" content="Lartiska — Maître Artisan finition luxe au Sénégal" />

    <meta property="og:image" content="https://lartiska.sn/1.jpg" />
    <meta property="og:image:alt" content="Salon contemporain avec mur d'art émeraude marbré et veines dorées à la feuille — réalisation Lartiska au Sénégal" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lartiska — Maître Artisan finition luxe au Sénégal" />
