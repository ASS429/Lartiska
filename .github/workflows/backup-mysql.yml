name: Backup MySQL → R2

# Sauvegarde la BDD Railway chaque dimanche à 03h UTC (= 03h Africa/Dakar)
# et l'upload sur Cloudflare R2 sous backups/YYYY-MM-DD.sql.gz.
#
# Secrets à configurer dans GitHub → Settings → Secrets and variables → Actions :
#   - MYSQL_HOST            (Railway → MySQL → MYSQLHOST côté public)
#   - MYSQL_PORT            (généralement 3306 ou un port custom Railway)
#   - MYSQL_DATABASE        (railway)
#   - MYSQL_USER            (root)
#   - MYSQL_PASSWORD        (MYSQL_ROOT_PASSWORD)
#   - R2_ACCESS_KEY_ID
#   - R2_SECRET_ACCESS_KEY
#   - R2_BUCKET             (lartiska-media)
#   - R2_ENDPOINT           (https://<account_id>.r2.cloudflarestorage.com)
#
# Pour récupérer un backup :
#   aws s3 cp s3://lartiska-media/backups/2026-05-19.sql.gz . --endpoint-url $R2_ENDPOINT
#   gunzip 2026-05-19.sql.gz
#   mysql -h ... < 2026-05-19.sql

on:
  schedule:
    - cron: '0 3 * * 0'   # Tous les dimanches à 03h UTC
  workflow_dispatch:       # Permet de lancer manuellement depuis l'onglet Actions

jobs:
  dump-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install MySQL client + AWS CLI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mysql-client unzip
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version

      - name: Dump database
        run: |
          DATE=$(date -u +%Y-%m-%d)
          FILE="lartiska-${DATE}.sql.gz"
          echo "FILE=${FILE}" >> $GITHUB_ENV

          mysqldump \
            --host="${{ secrets.MYSQL_HOST }}" \
            --port="${{ secrets.MYSQL_PORT }}" \
            --user="${{ secrets.MYSQL_USER }}" \
            --password="${{ secrets.MYSQL_PASSWORD }}" \
            --single-transaction \
            --quick \
            --routines \
            --triggers \
            --no-tablespaces \
            --set-gtid-purged=OFF \
            "${{ secrets.MYSQL_DATABASE }}" \
          | gzip > "$FILE"

          ls -lh "$FILE"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "$FILE" "s3://${{ secrets.R2_BUCKET }}/backups/$FILE" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --content-encoding gzip

      - name: Cleanup old backups (keep last 8 weeks)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 ls "s3://${{ secrets.R2_BUCKET }}/backups/" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
          | sort -r \
          | tail -n +9 \
          | awk '{print $4}' \
          | while read OLD; do
              if [ -n "$OLD" ]; then
                echo "Suppression : $OLD"
                aws s3 rm "s3://${{ secrets.R2_BUCKET }}/backups/$OLD" \
                  --endpoint-url "${{ secrets.R2_ENDPOINT }}"
              fi
            done
