services:
  - type: web
    name: lartiska-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.17.1
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Sitemap : proxifié vers l'API Laravel (généré dynamiquement) —
      # Google le lit ainsi sur le domaine principal du site.
      - type: rewrite
        source: /sitemap.xml
        destination: https://lartiska-web-production.up.railway.app/sitemap.xml
      - type: rewrite
        source: /*
        destination: /index.html
