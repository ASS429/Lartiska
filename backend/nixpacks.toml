# Configuration Nixpacks pour Railway
# Force PHP 8.4 — le composer.lock pin intervention/image 4 (php ^8.3) et
# symfony/* 8.x (php >=8.4). Sans ça Railway tombe sur PHP 8.2 par défaut.

[phases.setup]
# php84Extensions.gd : indispensable au ré-encodage WebP des images
# uploadées (ImageProcessor / Intervention Image). Sans lui, l'upload
# d'images renvoie 500 en prod alors que tout marche en local.
nixPkgs = ["php84", "php84Extensions.gd", "php84Packages.composer", "nodejs_20"]
nixLibs = ["openssl"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist"]

[phases.build]
# Pas de config:cache ici — les env vars Railway ne sont pas encore injectées
# au moment du build, le cache contiendrait des valeurs vides.
# Le cache est généré au runtime dans railway-start.sh après injection des env.
cmds = [
  "echo 'Build phase: skipping artisan cache (done at runtime)'"
]

[start]
cmd = "sh ./railway-start.sh"

[variables]
PHP_VERSION = "8.4"
NIXPACKS_PHP_VERSION = "8.4"
APP_ENV = "production"
LOG_CHANNEL = "stderr"
