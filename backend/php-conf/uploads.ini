; Limites d'upload pour les vidéos de réalisations (chargé via
; PHP_INI_SCAN_DIR dans railway-start.sh — voir ce script).
; 100 Mo par vidéo + marge pour le multipart (20 fichiers max par requête
; côté validation, mais on borne la requête à ~220 Mo au total).
upload_max_filesize = 100M
post_max_size = 220M
max_file_uploads = 25
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
